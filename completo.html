 D.p(`O interesse pelo tema surgiu durante o estágio curricular supervisionado realizado pelo acadêmico em uma fábrica de ração para bovinos, identificada neste trabalho como ${E}. A unidade está inserida em uma propriedade rural cuja atividade inclui pecuária de corte, e a ração produzida destina-se ao consumo interno, e não à comercialização. O processo compreende as etapas de recebimento e armazenamento de matérias-primas, pesagem e dosagem, moagem, mistura, acondicionamento e distribuição da ração aos animais.`);
 D.p(`Entre os materiais utilizados estão ${nomes(S.materiais.map(m=>lw(m.nome)))}, que apresentam características distintas de volume, forma de armazenagem e conservação. Parte deles é armazenada a granel e parte em sacarias com prazo de validade, o que exige critérios diferentes de controle.`);
 D.p(`Diante desse contexto, o trabalho delimita-se à gestão do estoque de matérias-primas da ${E} e busca responder à seguinte pergunta: como é realizado o gerenciamento do estoque de matérias-primas na ${E} e que melhorias podem contribuir para o controle e a conservação desses materiais?`);
 D.p(`O objetivo geral é analisar o gerenciamento do estoque de matérias-primas utilizado na produção de ração para bovinos na ${E}, identificando oportunidades de melhoria no controle e na conservação dos materiais com apoio das classificações ABC e XYZ, do critério FEFO e do programa 5S. Os objetivos específicos são: (a) descrever os procedimentos de recebimento, registro, armazenamento, movimentação e disponibilização das matérias-primas; (b) verificar como são acompanhados os saldos e realizadas as conferências do estoque; (c) classificar as matérias-primas segundo as curvas ABC e XYZ e construir a matriz ABC-XYZ; (d) verificar se a saída dos insumos com prazo de validade segue o critério FEFO; (e) avaliar o nível de organização da área de armazenagem segundo o programa 5S; (f) definir a estratégia de atendimento – MTS ou MTO – de cada ração e elaborar o plano mestre de produção; e (g) propor um plano de ação 5W2H compatível com a realidade operacional da unidade.`);
 D.p('Partiu-se das seguintes hipóteses: H1 – um número reduzido de matérias-primas concentra a maior parte do valor consumido; H2 – as matérias-primas apresentam diferentes graus de variabilidade no consumo, o que justifica políticas de reposição distintas; H3 – a ausência ou insuficiência de identificação de lote e validade dificulta a saída dos insumos ensacados segundo o critério FEFO; e H4 – a área de armazenagem apresenta oportunidades de melhoria mensuráveis nos sensos do programa 5S.');
 D.p('A relevância do estudo está na aplicação de conceitos de gestão de materiais e controle de processos a uma unidade agroindustrial de produção para uso próprio, aproximando conteúdos do curso de Engenharia de Produção Agroindustrial de uma situação concreta e oferecendo à unidade um diagnóstico e recomendações compatíveis com sua escala e seus recursos.');
 D.p('O trabalho está organizado em cinco capítulos: esta introdução; o referencial teórico; a metodologia; os resultados e a discussão; e as considerações finais.');
 /* ---- 2 referencial ---- */
 D.h1('2 REFERENCIAL TEÓRICO');
 D.h2('2.1 Gestão de estoques e materiais');
 D.p('Estoque corresponde aos materiais mantidos para atender necessidades futuras da operação. A gestão de materiais envolve decisões articuladas de aquisição, recebimento, armazenamento, controle e disponibilização, de modo que o material adequado esteja disponível quando necessário. Fenili (2015) apresenta a gestão de estoques como uma dimensão da administração de materiais e discute instrumentos de controle, classificação e reposição.');
 D.p('O controle de estoque requer informações confiáveis sobre entradas, saídas e saldos. O registro das movimentações permite comparar o estoque registrado (saldo teórico) com o estoque físico, identificar divergências e planejar reposições. A proporção de contagens cujas divergências permanecem dentro de uma tolerância definida é usualmente chamada de acurácia de inventário e indica a confiabilidade dos registros (DIAS, 2010; MARTINS; ALT, 2009).');
 D.h2('2.2 Armazenagem, conservação e boas práticas na alimentação animal');
 D.p('Armazenar não significa apenas reservar espaço para materiais. A disposição, a identificação e o acompanhamento das condições de conservação influenciam a localização dos itens, a prevenção de trocas e a possibilidade de rastrear lotes. A cartilha de boas práticas para fábricas de ração de uso próprio inclui rotinas de controle de estoque, armazenagem, conservação, documentação e registro (SEBRAE; ABCS, 2019).');
 D.p('A Embrapa descreve as Boas Práticas de Fabricação como procedimentos ligados à gestão da qualidade, à rastreabilidade, à padronização e à redução de custos, abrangendo a procedência e os registros das matérias-primas (MAZZUCO, s.d.). No Brasil, a Instrução Normativa nº 4, de 23 de fevereiro de 2007, do Ministério da Agricultura, Pecuária e Abastecimento, aprovou o regulamento técnico sobre condições higiênico-sanitárias e boas práticas de fabricação para estabelecimentos fabricantes de produtos destinados à alimentação animal (BRASIL, 2007).');
 D.h2('2.3 Classificação ABC');
 D.p('A classificação ABC fundamenta-se no princípio de Pareto, segundo o qual uma pequena parcela dos itens concentra a maior parte do valor movimentado em estoque (DIAS, 2010; MARTINS; ALT, 2009). Os itens são ordenados de forma decrescente pelo valor de consumo em um período, obtido pelo produto entre a quantidade consumida e o custo unitário, e calcula-se o percentual acumulado desse valor. Usualmente, a classe A reúne os itens que somam cerca de 80% do valor, a classe B os que somam cerca de 15% e a classe C os restantes; esses limites são convenções e podem ser ajustados à realidade da organização.');
 D.p('A finalidade da classificação é diferenciar o grau de controle: itens A tendem a exigir acompanhamento mais frequente de saldos, atenção nas compras e conferências mais rigorosas, enquanto itens C admitem controles mais simples (BALLOU, 2006).');
 D.h2('2.4 Classificação XYZ e matriz ABC-XYZ');
 D.p('Enquanto a curva ABC considera o valor, a classificação XYZ considera a regularidade do consumo. A variabilidade de cada item é medida pelo coeficiente de variação (CV), razão entre o desvio-padrão e a média do consumo em períodos iguais. Itens X apresentam consumo estável e previsível; itens Y, variação moderada; e itens Z, consumo irregular. Os limites de CV variam na literatura, de modo que o critério adotado deve ser explicitado.');
 D.p('A combinação das duas classificações gera uma matriz de nove células, que orienta políticas diferenciadas de reposição e de controle (SLACK; BRANDON-JONES; JOHNSTON, 2018). Itens AX favorecem reposição programada e estoques de segurança reduzidos; itens AZ demandam acompanhamento próximo e alinhamento com fornecedores; itens C admitem regras simples de reposição.');
 D.h2('2.5 Ponto de pedido e estoque de segurança');
 D.p('O ponto de pedido (PP) é o nível de estoque em que se deve emitir um novo pedido de compra, de modo que o material chegue antes que o saldo se esgote. Considerando consumo médio diário d, tempo de reposição (lead time) LT e estoque de segurança ES, tem-se PP = d × LT + ES (BALLOU, 2006). O estoque de segurança protege a operação contra variações do consumo e do prazo de entrega; quando o consumo diário apresenta desvio-padrão σ, pode ser estimado por ES = Z × σ × √LT, em que Z é o fator associado ao nível de serviço desejado – por exemplo, Z = 1,645 para 95% (SLACK; BRANDON-JONES; JOHNSTON, 2018).');
 D.h2('2.6 Critério FEFO');
 D.p('O critério FEFO (First Expired, First Out – primeiro que vence, primeiro que sai) determina que sejam utilizados primeiro os lotes com prazo de validade mais próximo, diferentemente do FIFO (First In, First Out), que considera apenas a ordem de entrada. Para materiais com validade definida, o FEFO reduz o risco de vencimento e de perdas, mas depende da identificação de lote e validade, de registros de movimentação e de um arranjo físico que permita acessar os lotes na ordem correta, em consonância com os princípios de rastreabilidade das boas práticas de fabricação (BRASIL, 2007; SEBRAE; ABCS, 2019).');
 D.h2('2.7 Programa 5S');
 D.p('O 5S é um programa de organização do ambiente de trabalho de origem japonesa, composto por cinco sensos: Seiri (utilização), Seiton (ordenação), Seiso (limpeza), Seiketsu (padronização e saúde) e Shitsuke (autodisciplina) (OSADA, 1992). Na armazenagem de matérias-primas para ração, o 5S contribui para o endereçamento e a identificação visual dos materiais, para a limpeza e o controle de pragas e para a segregação de itens avariados, criando a base física para a aplicação do FEFO.');
 D.h2('2.8 Planejamento e controle da produção: estratégias MTS e MTO');
 D.p('O planejamento e controle da produção (PCP) conecta a demanda à capacidade produtiva, definindo o que, quanto e quando produzir. Uma decisão estrutural do PCP é a estratégia de atendimento da demanda. Na produção para estoque (make to stock – MTS), os produtos são fabricados antecipadamente com base em previsões e mantidos em estoque, o que permite atendimento imediato, mas exige capital e espaço para o produto acabado. Na produção sob encomenda (make to order – MTO), a fabricação só é iniciada após o pedido, o que reduz o estoque de produto acabado, mas exige que o cliente aguarde o tempo de produção (SLACK; BRANDON-JONES; JOHNSTON, 2018).');
 D.p('A escolha entre MTS e MTO depende de fatores como estabilidade e volume da demanda, padronização do produto, perecibilidade, espaço de armazenagem e prazo de atendimento exigido. Em fábricas de ração de uso próprio, o cliente é o próprio rebanho: dietas consumidas diariamente em quantidade estável tendem ao MTS, enquanto dietas de uso esporádico ou ajustadas a lotes específicos tendem ao MTO. O plano mestre de produção traduz essas decisões em quantidades por período, que devem ser confrontadas com a capacidade do recurso gargalo, isto é, a etapa de menor capacidade do processo.');
 D.h2('2.9 Plano de ação 5W2H e sistemas integrados de gestão');
 D.p('O 5W2H é uma ferramenta de planejamento de ações que responde a sete perguntas: o quê (what), por quê (why), onde (where), quando (when), quem (who), como (how) e quanto custa (how much). É empregado em ciclos de melhoria contínua para transformar diagnósticos em ações com responsáveis e prazos definidos [[inserir referência sobre 5W2H/PDCA]].');
 D.p('Sistemas integrados de gestão (Enterprise Resource Planning – ERP) reúnem em uma base única os registros de diferentes áreas, como estoques, produção, compras e custos, permitindo que uma transação – por exemplo, a conclusão de uma ordem de produção – atualize automaticamente os saldos e os indicadores relacionados (SLACK; BRANDON-JONES; JOHNSTON, 2018). Neste trabalho, um ERP didático foi utilizado como instrumento de sistematização e análise dos dados.');
 /* ---- 3 metodologia ---- */
 D.h1('3 METODOLOGIA');
 D.p(`A pesquisa caracteriza-se como estudo de caso único, de caráter descritivo e abordagem qualitativa e quantitativa. O caso é o gerenciamento do estoque de matérias-primas da ${E}. O período de coleta correspondeu ao estágio curricular supervisionado, e os dados analisados abrangem ${nd} dias, de ${fd(d0)} a ${fd(d1)}.`);
 D.p('A coleta combinou: (a) observação direta das rotinas de recebimento, armazenagem, registro, separação e abastecimento da produção; (b) consulta a registros disponibilizados e autorizados, como notas de entrada, relatórios do software de pesagem e dosagem e registros de consumo; e (c) entrevistas semiestruturadas com funcionários e responsáveis. A participação foi voluntária, e não são reproduzidos nomes pessoais nem informações comerciais sensíveis. [[COMPLETAR: número de entrevistados, funções e datas; informar se houve submissão a comitê de ética.]]');
 D.p(`Os dados foram lançados no ERP Fábrica X, sistema desenvolvido para fins didáticos que integra os módulos de cadastro, movimentações, inventário, lotes, ordens de produção, compras, auditoria 5S, plano de ação e custos. No período, foram registradas ${S.movs.filter(v=>v.data>=d0&&v.data<=d1).length} movimentações de estoque, ${opsP.length} ordens de produção, ${cont.length} contagens físicas, ${ped.length} pedidos de compra e ${aud.filter(a=>a.data>=d0&&a.data<=d1).length} auditorias 5S.`);
 D.p(`Na curva ABC, adotaram-se como limites ${pctF(c.abcA,0)} e ${pctF(c.abcB,0)} do valor acumulado para as classes A e B. Na classificação XYZ, calculou-se o CV do consumo diário de cada item, adotando-se X para CV ≤ ${num(c.xyzX,2)}, Y para CV ≤ ${num(c.xyzY,2)} e Z para valores superiores [[justificar os limites com a referência adotada]]. O ponto de pedido foi calculado com consumo médio e desvio-padrão dos últimos ${c.janela} dias e nível de serviço definido por item. A acurácia de inventário considerou tolerância de ${pctF(c.tol,0)}, e o alerta de validade, ${c.alerta} dias. A auditoria 5S utilizou checklist de 15 itens, três por senso, com notas de 1 a 5. No projeto de produção, a estratégia de cada ração foi avaliada por seis critérios pontuados de 1 (favorece MTO) a 5 (favorece MTS), adotando-se MTS para média igual ou superior a 3; a capacidade foi estimada pela etapa gargalo, considerando ${num(S.processo.horasDia,1)} horas de operação por dia, e o plano mestre foi elaborado para ${VSTATE.pmDias||14} dias.`);
 }
 /* ---- 4 resultados ---- */
 D.h1(soDados?'RESULTADOS – TABELAS E FIGURAS':'4 RESULTADOS E DISCUSSÃO');
 D.h2('4.1 Caracterização da unidade e do fluxo de materiais');
 D.p(`No período analisado, a ${E} concluiu ${opsP.length} ordens de produção, totalizando ${num(prodT/1000,1)} toneladas de ração, com média de ${num(prodT/nd/1000,2)} t/dia. O estoque é composto por ${S.materiais.length} matérias-primas, das quais ${S.materiais.filter(m=>m.tipo==='granel').length} armazenadas a granel e ${S.materiais.filter(m=>m.tipo==='ensacado').length} ensacadas, com controle de lote e validade (Tabela ${D.nT+1}).`);

function sha256(s){s=unescape(encodeURIComponent(String(s)));function rr(v,a){return(v>>>a)|(v<<(32-a))}const mp=Math.pow,mw=mp(2,32);let res='',w=[],bl=s.length*8,h=[],k=[],pc=0;const comp={};for(let c=2;pc<64;c++){if(!comp[c]){for(let i=0;i<313;i+=c)comp[i]=c;h[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0}}s+='\x80';while(s.length%64-56)s+='\x00';for(let i=0;i<s.length;i++){const j=s.charCodeAt(i);w[i>>2]|=j<<((3-i)%4)*8}w[w.length]=((bl/mw)|0);w[w.length]=bl;for(let j=0;j<w.length;){const W=w.slice(j,j+=16),old=h;h=h.slice(0,8);for(let i=0;i<64;i++){const w15=W[i-15],w2=W[i-2],a=h[0],e=h[4],t1=h[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&h[5])^((~e)&h[6]))+k[i]+(W[i]=(i<16)?W[i]:(W[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+W[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0),t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&h[1])^(a&h[2])^(h[1]&h[2]));h=[(t1+t2)|0].concat(h);h[4]=(h[4]+t1)|0}for(let i=0;i<8;i++)h[i]=(h[i]+old[i])|0}for(let i=0;i<8;i++)for(let j=3;j+1;j--){const b=(h[i]>>(j*8))&255;res+=((b<16)?0:'')+b.toString(16)}return res}

VIEWS.conferencia=()=>{const last=S.conferencias[S.conferencias.length-1];const d0=primeiraData(),d1=ultimaData();
 return head('Conferência manual × ERP','Antes de ver os resultados completos, informe os valores que você calculou à mão (planilha ou papel) para alguns itens. O sistema mostra apenas se eles conferem com o cálculo do ERP.')+`<div class="card"><p class="help">Período considerado na curva ABC: <b>${fd(d0)} a ${fd(d1)}</b> (todos os registros). Ponto de pedido: consumo médio e desvio-padrão dos últimos ${S.config.janela} dias e parâmetros do cadastro (lead time, nível de serviço). Preencha ao menos 2 itens.</p>
 ${table(['Matéria-prima','Classe ABC (seu cálculo)','Ponto de pedido – seu cálculo (kg)'],S.materiais.map(m=>[esc(m.nome),`<select id="cfA_${m.id}"><option value="">–</option><option>A</option><option>B</option><option>C</option></select>`,`<input id="cfP_${m.id}" type="number" style="width:140px">`]))}<div class="bar"><button class="p" onclick="conferir()">Conferir</button></div></div>
 ${last?`<div class="card"><h3 style="margin-top:0">Resultado da última conferência (${fd(last.data)})</h3>${table(['Matéria-prima','ABC – seu','ABC – ERP','Confere?','PP – seu (kg)','PP – ERP (kg)','Diferença','Confere? (±5%)'],last.itens.map(i=>[esc(M(i.matId).nome),i.abcA||'–',i.abcA?i.abcE:'–',i.abcA?(i.abcA===i.abcE?tag('Sim','ok'):tag('Não','bad')):'',i.ppA?num(i.ppA):'–',i.ppA?num(i.ppE):'–',i.ppA?pct((i.ppA-i.ppE)/i.ppE,1):'',i.ppA?(Math.abs(i.ppA-i.ppE)/i.ppE<=.05?tag('Sim','ok'):tag('Não','bad')):'']),[4,5,6])}<p class="help">Divergências são esperadas e fazem parte do aprendizado: verifique período, custos, consumo médio, desvio-padrão, lead time e o fator Z utilizados. Registre as conclusões no relatório de conferência (entrega da Etapa 3). Conferências realizadas: ${S.conferencias.length}.</p></div>`:''}`};
function conferir(){const A={};abc(primeiraData(),ultimaData()).rows.forEach(r=>A[r.m.id]=r.classe);const itens=[];S.materiais.forEach(m=>{const a=document.getElementById('cfA_'+m.id).value,p=+document.getElementById('cfP_'+m.id).value;if(a||p>0)itens.push({matId:m.id,abcA:a,abcE:A[m.id],ppA:p>0?p:null,ppE:ppCalc(m).PP})});if(itens.length<2)return alert('Preencha ao menos 2 itens.');S.conferencias.push({data:today(),itens});save();render()}
VIEWS.gerartcc=()=>{const t=VSTATE.tcc=VSTATE.tcc||{};return head(ADMIN||MODO_COMPLETO?'Gerar TCC completo / relatório de dados':'Relatório de dados (tabelas e figuras)',ADMIN||MODO_COMPLETO?'Você pode gerar o rascunho completo do TCC (com texto) ou apenas o relatório de dados.':'Gera um arquivo Word com as tabelas e figuras numeradas (padrão ABNT) a partir dos dados do ERP, para o capítulo de resultados e os apêndices. Não contém texto interpretativo: a análise e a discussão são redigidas por você.')+`<div class="card"><div class="fg"><label class="f full">Título do trabalho<input value="${esc(t.titulo||'GESTÃO DE ESTOQUE E SUA IMPORTÂNCIA: UMA ANÁLISE DO GERENCIAMENTO DE ESTOQUE EM UMA FÁBRICA DE RAÇÃO PARA BOVINOS')}" onchange="VSTATE.tcc.titulo=this.value"></label><label class="f">Período analisado – de<input type="date" value="${t.d0||primeiraData()}" onchange="VSTATE.tcc.d0=this.value"></label><label class="f">até<input type="date" value="${t.d1||ultimaData()}" onchange="VSTATE.tcc.d1=this.value"></label><label class="f">Ano<input value="${esc(t.ano||dataBase().slice(0,4))}" onchange="VSTATE.tcc.ano=this.value"></label></div>
 <div class="bar"><button class="p" id="btnDados" onclick="clickTCC(true)">Gerar relatório de dados (.docx)</button>${ADMIN||MODO_COMPLETO?'<button class="p" id="btnTCC" onclick="clickTCC(false)">Gerar TCC completo com texto (.docx)</button>':''}<span id="tccMsg" class="help"></span></div></div>
 <div class="card help"><b>Orientações:</b><ol><li>Abra no Word; se perguntar sobre atualizar campos, responda <b>Sim</b>.</li><li>As tabelas e figuras usam os dados lançados; confira o período antes de gerar.</li>${ADMIN||MODO_COMPLETO?'<li><b>TCC completo:</b> rascunho com texto e trechos em amarelo para completar. Recomenda-se usá-lo como referência do orientador, e não entregá-lo ao aluno como texto pronto.</li>':''}<li>Verifique as normas do curso sobre declaração de uso de ferramentas digitais/IA e cite o ERP na metodologia como instrumento de sistematização dos dados.</li></ol></div>${S.ilustrativo?'<div class="banner">Com os dados ilustrativos atuais, o arquivo sai marcado como modelo.</div>':''}`};
async function clickTCC(soDados){const m=document.getElementById('tccMsg');if(!soDados&&!ADMIN&&!MODO_COMPLETO)return alert('Disponível apenas para o professor.');m.textContent='Gerando…';try{const r=await gerarTCC(soDados);m.textContent=`Pronto: ${r.tabelas} tabelas e ${r.figuras} figuras. Verifique a pasta de downloads.`}catch(e){m.textContent='Erro ao gerar: '+e.message}}

/* ---------------- início ---------------- */
if(!load())seed();migrate();migrateEtapas();if(!acesso(VIEW))VIEW='etapas';if(MODO_COMPLETO)VIEW='painel';
render();
</script>
</body>
</html>
